name: "equal-earth-projection-benchmark: refresh data"

on:
  schedule:
    # World Bank / UN WPP figures are revised a few times a year, not daily.
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: equal-earth-projection-benchmark

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild data/world.json
        run: python scripts/prepare_web_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/world.json; then
            echo "No data changes."
          else
            git add data/world.json
            git commit -m "chore(equal-earth-projection-benchmark): refresh population & area data"
            git push
          fi
